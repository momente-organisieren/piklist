name: Release Package

on:
  push:
    tags:
      - 'v*' # Workflow wird ausgelöst, wenn ein Tag mit 'v' gepusht wird

jobs:
  build-and-release:
    name: Package und Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explizite Berechtigungen für Release-Erstellung

    steps:
      # Repository auschecken
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Vollständige Git-Historie für bessere Release-Informationen

      # Repository in ZIP-Datei mit piklist-Ordner archivieren
      - name: ZIP-Datei mit piklist-Ordner erstellen
        run: |
          # Temporären piklist-Ordner erstellen
          mkdir -p /tmp/piklist

          # Alle Dateien in den piklist-Ordner kopieren (außer .git)
          rsync -av --exclude=".git" --exclude=".github" . /tmp/piklist/

          # In das temporäre Verzeichnis wechseln und ZIP erstellen
          cd /tmp
          zip -r piklist.zip piklist

          # ZIP zurück ins Arbeitsverzeichnis kopieren
          cp piklist.zip $GITHUB_WORKSPACE/

      # Release erstellen und Asset hochladen
      - name: Release erstellen und Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            Dieses Release enthält das Plugin in einem "piklist"-Ordner.

            **Erstellungsdatum:** ${{ github.event.repository.updated_at }}
          files: |
            piklist.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
