name: Release Package

on:
  push:
    tags:
      - 'v*' # Workflow wird ausgelöst, wenn ein Tag mit 'v' gepusht wird

jobs:
  build-and-release:
    name: Package und Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explizite Berechtigungen für Release-Erstellung

    steps:
      # Repository auschecken
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Vollständige Git-Historie für bessere Release-Informationen

      # Repository in ZIP-Datei archivieren
      - name: ZIP-Datei erstellen
        run: |
          zip -r piklist.zip . -x "*.git*" # Git-Dateien ausschließen für kleinere Pakete

      # Release erstellen und Asset hochladen (kombiniert in einem Schritt)
      - name: Release erstellen und Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            Dieses Release enthält das gepackte Repository.

            **Erstellungsdatum:** ${{ github.event.repository.updated_at }}
          files: |
            piklist.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true # Automatische Release Notes aus Commits generieren
