name: Release Workflow

on:
  push:
    tags:
      - 'v*' # Trigger the workflow when pushing a tag that starts with 'v'

jobs:
  build-and-release:
    name: Package and Release
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Archive the entire repository into a zip file
      - name: Create ZIP File
        run: |
          zip -r piklist.zip .

      # Step 3: Upload the ZIP file as a GitHub release asset
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            This release contains the packaged repository.
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./piklist.zip
          asset_name: piklist.zip
          asset_content_type: application/zip